[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "model-risk-lab"
version = "0.1.0"
description = "Reproducible model validation experiments with synthetic data"
requires-python = ">=3.11"
readme = "README.md"
license = "MIT"
dependencies = [
  "numpy>=1.26,<3", "pandas>=2.2,<4", "scipy>=1.12,<2",
  "scikit-learn>=1.5,<2", "matplotlib>=3.8,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.12,<1"]

[project.scripts]
model-risk-lab = "model_risk_lab.report:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
