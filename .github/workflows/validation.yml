name: Validation
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -c requirements-reproduce.txt '.[dev]'
      - run: python -m ruff check src tests
      - run: python -m pytest -q
      - name: Run installed package outside the checkout
        working-directory: ${{ runner.temp }}
        run: |
          model-risk-lab --seed 20260907 --output validation-report
          model-risk-lab --verify validation-report
          model-risk-forecast --example --output monthly-development
          model-risk-forecast --request monthly-development/request.json --reveal-holdout --output monthly-holdout
      - uses: actions/upload-artifact@v4
        with:
          name: validation-python-${{ matrix.python }}
          path: |
            ${{ runner.temp }}/validation-report/
            ${{ runner.temp }}/monthly-development/
            ${{ runner.temp }}/monthly-holdout/
          if-no-files-found: error
